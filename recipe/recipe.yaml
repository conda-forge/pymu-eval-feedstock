schema_version: 1

context:
  version: "0.0.4"

package:
  name: pymu-eval
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pymu-eval/pymu_eval-${{ version }}.tar.gz
  sha256: 5368edf2a1c5577a5358d6a9bd0990160e63a543d6082578ac5e8ff585554a57

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pymu_eval
      pip_check: true
  - script:
      - pytest -v tests
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    files:
      source:
        - tests


about:
  summary: Python implementation of muParser math syntax parser with NumPy and optional xarray support
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pymu-eval.readthedocs.io

extra:
  recipe-maintainers:
    - petebunting
